services:
  signal-agent:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
    image: signal-cli-agent:local
    container_name: signal-agent
    restart: unless-stopped
    network_mode: host
    environment:
      - XDG_CONFIG_HOME=/config
      - XDG_DATA_HOME=/data
      - SIGNAL_CLI_CONFIG=/data/signal-cli
      # - SIGNAL_ACCOUNT=+15551234567
    volumes:
      - ../../config:/config
      - ../../data:/data
